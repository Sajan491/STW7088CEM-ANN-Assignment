# Task 2 (ablation arm: +resolution) — same as baseline but 1024 px input.
# Isolates the effect of higher input resolution on small-object detection.
seed: 42

data:
  annotations_file: data/annotations/annotations.json
  images_dir: data/images
  splits_file: data/processed/splits.json
  yolo_dir: data/yolo
  data_yaml: data/yolo/data.yaml
  class_name: rubbish

model:
  weights: yolov8s.pt

train:
  imgsz: 1024                    # higher resolution (vs 640 baseline)
  epochs: 80
  batch: 8                       # smaller batch: 1024 px needs more GPU memory
  patience: 15
  optimizer: auto
  lr0: 0.01
  seed: 42
  project: runs/detect
  name: yolo_res1024
  augment: {}                    # Ultralytics defaults (as baseline) -> isolates resolution

eval:
  split: test
  figures_dir: results/figures
  tables_dir: results/tables
  checkpoint_dir: checkpoints
  checkpoint_name: yolo_res1024.pt
  metrics_file: results/tables/yolo_res1024_metrics.csv
